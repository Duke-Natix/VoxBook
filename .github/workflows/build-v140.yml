name: Build VoxBook 1.4.0 Google Play Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[play-v140]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare VoxBook source through 1.4.0
        run: |
          set -e
          for v in 050 060 070 071 080 090 091 092 100 110 111 112 113 114 115 116 120 121 130 131 132 133 134 135 136 140; do
            python "tools/prepare_v${v}.py"
          done

      - name: Install and build web UI
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          cd ..
          python tools/tune_pocket_tts.py
          cd web
          npm run build
          rm -rf ../app/src/main/assets/vox
          mkdir -p ../app/src/main/assets/vox
          cp -R dist/. ../app/src/main/assets/vox/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK, CMake and audio tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Prepare native Pocket-TTS runtime and 8 German voice profiles
        run: |
          set -e
          rm -rf /tmp/voxbook-pocket-native /tmp/voxbook-thorsten /tmp/voxbook-kerstin /tmp/voxbook-hokuspokus
          git clone --depth 1 --branch v0.5.2 https://github.com/The-unknown-Shadowman/PocketTTS-Android-Engine.git /tmp/voxbook-pocket-native
          mkdir -p vendor/PocketTTS.cpp app/src/main/cpp app/src/main/assets/licenses app/src/main/assets/voices app/src/main/jniLibs/arm64-v8a app/src/main/third_party /tmp/voxbook-thorsten /tmp/voxbook-kerstin /tmp/voxbook-hokuspokus
          cp /tmp/voxbook-pocket-native/vendor/PocketTTS.cpp/pocket_tts.cpp vendor/PocketTTS.cpp/pocket_tts.cpp
          cp /tmp/voxbook-pocket-native/app/src/main/cpp/CMakeLists.txt app/src/main/cpp/CMakeLists.txt
          cp /tmp/voxbook-pocket-native/app/src/main/cpp/jni_bridge.cpp app/src/main/cpp/jni_bridge.cpp
          sed -i 's/Java_org_pockettts_android_engine_NativePocketTts_/Java_com_varoxan_voxbook_NativePocketTts_/g' app/src/main/cpp/jni_bridge.cpp
          bash /tmp/voxbook-pocket-native/scripts/prepare_android_native_deps.sh
          cp /tmp/voxbook-pocket-native/app/src/main/jniLibs/arm64-v8a/libonnxruntime.so app/src/main/jniLibs/arm64-v8a/libonnxruntime.so
          rm -rf app/src/main/third_party/onnxruntime
          cp -R /tmp/voxbook-pocket-native/app/src/main/third_party/onnxruntime app/src/main/third_party/onnxruntime
          cp /tmp/voxbook-pocket-native/LICENSE app/src/main/assets/licenses/PocketTTS-Android-Engine-LICENSE.txt
          cp /tmp/voxbook-pocket-native/THIRD_PARTY_NOTICES.md app/src/main/assets/licenses/PocketTTS-Android-Engine-THIRD-PARTY.md
          cp /tmp/voxbook-pocket-native/MODEL_LICENSE.md app/src/main/assets/licenses/PocketTTS-MODEL-LICENSE.md

          THORSTEN_REF="29d0c153c55d8ffaa0ebf8ed1ecc879bff9fdf27"
          for n in 01 02 03 04; do
            curl -fL "https://raw.githubusercontent.com/thorstenMueller/Thorsten-Voice/${THORSTEN_REF}/docs/samples/sample${n}-gt.wav" -o "/tmp/voxbook-thorsten/sample${n}.wav"
          done
          curl -fL "https://raw.githubusercontent.com/thorstenMueller/Thorsten-Voice/${THORSTEN_REF}/LICENSE" -o app/src/main/assets/licenses/Thorsten-Voice-CC0.txt
          python - <<'PY'
          import wave
          from pathlib import Path
          sources=[Path(f'/tmp/voxbook-thorsten/sample{n}.wav') for n in ('01','02','03','04')]
          target=Path('app/src/main/assets/voices/thorsten-cc0.wav')
          fmt=None; chunks=[]
          for src in sources:
              with wave.open(str(src),'rb') as w:
                  cur=(w.getnchannels(),w.getsampwidth(),w.getframerate(),w.getcomptype())
                  if fmt is None: fmt=cur
                  elif cur != fmt: raise SystemExit(f'WAV format mismatch: {src}')
                  chunks.append(w.readframes(w.getnframes()))
          channels,width,rate,_=fmt
          silence=b'\x00' * int(rate*0.10) * channels * width
          with wave.open(str(target),'wb') as w:
              w.setnchannels(channels); w.setsampwidth(width); w.setframerate(rate); w.setcomptype('NONE','not compressed')
              for i,data in enumerate(chunks):
                  if i: w.writeframes(silence)
                  w.writeframes(data)
          PY
          ffmpeg -hide_banner -loglevel error -y -i app/src/main/assets/voices/thorsten-cc0.wav -af "asetrate=24000*0.92,aresample=24000,atempo=1.0869565,highpass=f=65,lowpass=f=8800" -ar 24000 -ac 1 -c:a pcm_s16le app/src/main/assets/voices/thorsten-tief-cc0.wav
          ffmpeg -hide_banner -loglevel error -y -i app/src/main/assets/voices/thorsten-cc0.wav -af "asetrate=24000*0.975,aresample=24000,atempo=1.025641,equalizer=f=180:t=q:w=1:g=1.6,equalizer=f=4200:t=q:w=1:g=-1.2,lowpass=f=9400" -ar 24000 -ac 1 -c:a pcm_s16le app/src/main/assets/voices/thorsten-warm-cc0.wav

          for n in 0004 0007 0008 0010 0011 0012; do
            curl -fL "https://raw.githubusercontent.com/rhasspy/dataset-voice-kerstin/master/verified/de_rhasspy-${n}.flac" -o "/tmp/voxbook-kerstin/${n}.flac"
          done
          curl -fL "https://raw.githubusercontent.com/rhasspy/dataset-voice-kerstin/master/LICENSE" -o app/src/main/assets/licenses/Kerstin-Voice-CC0.txt
          printf "file '/tmp/voxbook-kerstin/0004.flac'\nfile '/tmp/voxbook-kerstin/0007.flac'\nfile '/tmp/voxbook-kerstin/0008.flac'\nfile '/tmp/voxbook-kerstin/0010.flac'\nfile '/tmp/voxbook-kerstin/0011.flac'\nfile '/tmp/voxbook-kerstin/0012.flac'\n" > /tmp/voxbook-kerstin/list.txt
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i /tmp/voxbook-kerstin/list.txt -t 13 -ar 24000 -ac 1 -c:a pcm_s16le app/src/main/assets/voices/kerstin-cc0.wav
          ffmpeg -hide_banner -loglevel error -y -i app/src/main/assets/voices/kerstin-cc0.wav -af "asetrate=24000*0.965,aresample=24000,atempo=1.036269,highpass=f=80,lowpass=f=8200,equalizer=f=2800:t=q:w=1:g=-1.1" -ar 24000 -ac 1 -c:a pcm_s16le app/src/main/assets/voices/kerstin-sanft-cc0.wav

          curl -fL "https://huggingface.co/datasets/semidark/hokuspokus-qwen3-tts-hybrid/resolve/main/qwen-tts-seeds/deutsche_literaturgeschichte_oneshot.mp3?download=true" -o /tmp/voxbook-hokuspokus/seed.mp3
          curl -fL "https://huggingface.co/datasets/semidark/hokuspokus-qwen3-tts-hybrid/resolve/main/README.md?download=true" -o app/src/main/assets/licenses/Hokuspokus-Dataset-CC0.md
          ffmpeg -hide_banner -loglevel error -y -i /tmp/voxbook-hokuspokus/seed.mp3 -ss 0.20 -t 13 -ar 24000 -ac 1 -c:a pcm_s16le app/src/main/assets/voices/hokuspokus-cc0.wav
          ffmpeg -hide_banner -loglevel error -y -i app/src/main/assets/voices/hokuspokus-cc0.wav -af "asetrate=24000*0.955,aresample=24000,atempo=1.04712,equalizer=f=220:t=q:w=1:g=1.3,equalizer=f=5200:t=q:w=1:g=-1.3,lowpass=f=9000" -ar 24000 -ac 1 -c:a pcm_s16le app/src/main/assets/voices/hokuspokus-warm-cc0.wav

          python - <<'PY'
          import wave
          from pathlib import Path
          names=('thorsten-cc0.wav','thorsten-tief-cc0.wav','thorsten-warm-cc0.wav','kerstin-cc0.wav','kerstin-sanft-cc0.wav','hokuspokus-cc0.wav','hokuspokus-warm-cc0.wav')
          for name in names:
              p=Path('app/src/main/assets/voices')/name
              with wave.open(str(p),'rb') as w:
                  sec=w.getnframes()/w.getframerate()
                  print(f'{name}: {sec:.2f}s, {w.getframerate()}Hz, {w.getnchannels()}ch')
                  if not (5.0 <= sec <= 18.0): raise SystemExit(f'Unexpected voice reference duration: {name} {sec:.2f}s')
          PY
          for f in thorsten-cc0.wav thorsten-tief-cc0.wav thorsten-warm-cc0.wav kerstin-cc0.wav kerstin-sanft-cc0.wav hokuspokus-cc0.wav hokuspokus-warm-cc0.wav; do test -s "app/src/main/assets/voices/$f"; done
          test -s vendor/PocketTTS.cpp/pocket_tts.cpp
          test -s app/src/main/jniLibs/arm64-v8a/libonnxruntime.so

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore stable VoxBook Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.voxbook-signing/voxbook.keystore
          key: voxbook-android-signing-v2

      - name: Ensure stable signing key exists
        run: |
          mkdir -p "$HOME/.voxbook-signing"
          if [ ! -f "$HOME/.voxbook-signing/voxbook.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.voxbook-signing/voxbook.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=VoxBook Stable,O=VoxBook,C=AT"
          fi
          keytool -list -v -keystore "$HOME/.voxbook-signing/voxbook.keystore" -storepass "${VOXBOOK_KEYSTORE_PASSWORD:-android}" -alias "${VOXBOOK_KEY_ALIAS:-androiddebugkey}" | grep -E 'SHA256:|Valid from:' || true
        env:
          VOXBOOK_KEYSTORE_PASSWORD: ${{ secrets.VOXBOOK_KEYSTORE_PASSWORD }}
          VOXBOOK_KEY_ALIAS: ${{ secrets.VOXBOOK_KEY_ALIAS }}

      - name: Build 1.4.0 sideload tester APK
        run: gradle --no-daemon assembleDebug

      - name: Save tester APK before Play hardening
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VoxBook-1.4.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk VoxBook.apk

      - name: Apply Google Play hardening
        run: python tools/prepare_play.py

      - name: Verify Play source contains no sideload installer
        run: |
          set -e
          FILE=app/src/main/java/com/varoxan/voxbook/MainActivity.java
          if grep -E 'ACTION_MANAGE_UNKNOWN_APP_SOURCES|canRequestPackageInstalls|releases/latest/download/VoxBook\.apk|VoxBook-update-|application/vnd\.android\.package-archive|FileProvider\.getUriForFile' "$FILE"; then
            echo 'Forbidden sideload updater code remains in Play source.' >&2
            exit 1
          fi

      - name: Build signed Google Play app bundle
        env:
          VOXBOOK_KEYSTORE_PASSWORD: ${{ secrets.VOXBOOK_KEYSTORE_PASSWORD }}
          VOXBOOK_KEY_ALIAS: ${{ secrets.VOXBOOK_KEY_ALIAS }}
          VOXBOOK_KEY_PASSWORD: ${{ secrets.VOXBOOK_KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease

      - name: Verify merged Play manifest
        run: |
          set -e
          MF=$(find app/build/intermediates -type f -name AndroidManifest.xml -path '*release*' | grep -E 'merged_manifest|merged_manifests' | head -n 1 || true)
          if [ -z "$MF" ]; then
            echo 'Merged release manifest was not found.' >&2
            exit 1
          fi
          echo "Checking $MF"
          if grep -E 'REQUEST_INSTALL_PACKAGES|androidx\.core\.content\.FileProvider' "$MF"; then
            echo 'Play manifest still contains sideload installation capability.' >&2
            exit 1
          fi

      - name: Inspect native libraries for 16 KB page-size readiness
        run: |
          set -e
          AAB=app/build/outputs/bundle/release/app-release.aab
          rm -rf /tmp/voxbook-aab
          mkdir -p /tmp/voxbook-aab
          unzip -q "$AAB" -d /tmp/voxbook-aab
          READELF="${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          REPORT="$GITHUB_WORKSPACE/16kb-alignment-report.txt"
          : > "$REPORT"
          python - "$READELF" "$REPORT" <<'PY'
          import pathlib, re, subprocess, sys
          readelf, report = sys.argv[1], pathlib.Path(sys.argv[2])
          libs = sorted(pathlib.Path('/tmp/voxbook-aab').rglob('*.so'))
          bad=[]
          lines=[]
          for lib in libs:
              out=subprocess.check_output([readelf,'-lW',str(lib)],text=True,errors='replace')
              aligns=[]
              for line in out.splitlines():
                  if line.lstrip().startswith('LOAD '):
                      m=re.search(r'(0x[0-9a-fA-F]+)\s*$',line)
                      if m: aligns.append(int(m.group(1),16))
              minimum=min(aligns) if aligns else 0
              ok=bool(aligns) and minimum >= 0x4000
              lines.append(f'{lib.name}: min LOAD align={minimum:#x} -> {"16KB-ready" if ok else "needs review"}')
              if not ok: bad.append(lib.name)
          report.write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          if bad:
              print('::warning::Native libraries needing 16 KB review: '+', '.join(bad))
          PY

      - name: Prepare build files
        run: |
          cp app/build/outputs/bundle/release/app-release.aab VoxBook-1.4.0-play.aab
          test -s VoxBook-1.4.0.apk
          test -s VoxBook-1.4.0-play.aab

      - name: Upload APK, Play AAB and compatibility report
        uses: actions/upload-artifact@v4
        with:
          name: VoxBook-1.4.0-Google-Play
          path: |
            VoxBook-1.4.0.apk
            VoxBook-1.4.0-play.aab
            16kb-alignment-report.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish VoxBook 1.4.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES='VoxBook 1.4.0 is the Google Play launch candidate. The Play AAB targets Android 16 / API 36, uses Play-managed updates, physically excludes the GitHub APK self-updater and REQUEST_INSTALL_PACKAGES, includes an in-app privacy-policy entry point, and retains the 1.3.6 audiobook, PDF, voice-profile, background playback and help features. The APK remains the sideload/tester build with the existing GitHub updater.'
          if gh release view v1.4.0 >/dev/null 2>&1; then
            gh release upload v1.4.0 VoxBook.apk VoxBook-1.4.0.apk VoxBook-1.4.0-play.aab 16kb-alignment-report.txt --clobber
          else
            gh release create v1.4.0 VoxBook.apk VoxBook-1.4.0.apk VoxBook-1.4.0-play.aab 16kb-alignment-report.txt \
              --title "VoxBook 1.4.0 – Google Play Release Candidate" \
              --notes "$NOTES"
          fi
