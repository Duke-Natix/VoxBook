name: Build VoxBook APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-v042]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare VoxBook 0.4.2 continuous audiobook engine
        working-directory: web
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/main.js')
          s=p.read_text()

          if "./narration.js" not in s:
              s=s.replace(
                  "import { PocketTTS, StreamingPlayer } from 'pocket-tts-js';",
                  "import { PocketTTS, StreamingPlayer } from 'pocket-tts-js';\nimport { buildNarrationSegments } from './narration.js';"
              )

          s=s.replace("l==='de'?'german':'english'", "l==='de'?'german':'english_2026-04'")
          s=re.sub(
              r"function segments\(text\)\{.*?\}\nfunction lang",
              "function segments(text){return buildNarrationSegments(text,S.detected,{paragraphPauses:S.paragraphPauses,dialogueMode:S.dialogueMode})}\nfunction lang",
              s,
              flags=re.S
          )

          # One passage is passed to StreamingPlayer as ONE PCM buffer. Pocket-TTS may
          # generate dozens of tiny chunks, but the listener never hears chunk borders.
          # While passage N is playing, passage N+1 is generated in the worker.
          new_ai=r'''function joinPcmChunks(chunks){
            let total=0;
            for(const c of chunks) total+=c.length;
            const pcm=new Float32Array(total);
            let offset=0;
            for(const c of chunks){pcm.set(c,offset);offset+=c.length}
            return pcm
          }

          async function generateWholePassage(text,voice,timeoutMs=30000){
            const chunks=[];
            let timer;
            try{
              await Promise.race([
                S.ai.tts.generate(text,{
                  voice,
                  onChunk:(audio)=>{
                    if(audio?.length) chunks.push(new Float32Array(audio));
                  }
                }),
                new Promise((_,reject)=>{
                  timer=setTimeout(()=>reject(new Error('VOXBOOK_PASSAGE_TIMEOUT')),timeoutMs);
                })
              ]);
            }finally{
              clearTimeout(timer);
            }
            if(!chunks.length) throw new Error('VOXBOOK_NO_AUDIO');
            return joinPcmChunks(chunks)
          }

          async function aiNarrate(){
            const tok=++S.ai.token;
            const ok=await ensureAi();
            if(!ok||!S.playing||tok!==S.ai.token){S.playing=false;refreshPlayer();return}
            if(S.ai.useOwnVoice&&!S.ai.activeVoice){if(!await ownVoice()){S.playing=false;refreshPlayer();tab('voices');return}}
            if(!S.ai.useOwnVoice&&!S.ai.activeVoice)await builtVoice();
            if(!S.ai.activeVoice){toast('Keine KI-Stimme verfügbar.');S.playing=false;refreshPlayer();return}

            const fallbackToSystem=()=>{
              if(!S.playing||tok!==S.ai.token)return;
              ++S.ai.token;
              try{S.ai.tts?.stop?.()}catch{}
              S.mode='system';
              localStorage.voiceMode='system';
              $('engineState').textContent='Systemstimme übernimmt';
              refreshPlayer();
              toast('KI ist auf diesem Gerät zu langsam – Systemstimme übernimmt.');
              systemNarrate();
            };

            let first=true;
            while(S.playing&&tok===S.ai.token&&S.index<S.segments.length){
              refreshPlayer();
              $('engineState').textContent=first?'KI bereitet ersten Satz vor …':'Nächste Passage wird vorbereitet …';
              let pcm;
              try{
                pcm=await generateWholePassage(S.segments[S.index],S.ai.activeVoice,30000);
              }catch(e){
                console.error(e);
                if(String(e?.message||e).includes('VOXBOOK_PASSAGE_TIMEOUT')){fallbackToSystem();return}
                S.playing=false;refreshPlayer();toast('KI-Vorlesen wurde unterbrochen.');return
              }
              if(!S.playing||tok!==S.ai.token)return;

              // One continuous AudioBuffer per passage. No model chunk can cut a word.
              const isLast=S.index===S.segments.length-1;
              S.ai.player.play(pcm,{isLast});
              $('engineState').textContent=S.ai.useOwnVoice?'Meine Stimme · spielt flüssig':'KI-Erzähler · spielt flüssig';
              first=false;
              S.index++;
              refreshPlayer();
              // No await here: AudioContext is already playing this complete passage;
              // the worker can synthesize the next passage at the same time.
            }
            try{S.ai.player?.flush?.()}catch{}
            if(S.index>=S.segments.length){
              $('engineState').textContent='Letzte Passage läuft …';
              S.playing=false;
              refreshPlayer();
            }
          }'''

          s=re.sub(r"async function aiNarrate\(\)\{.*?\}\nfunction uiAi", new_ai+"\nfunction uiAi", s, flags=re.S)

          # Since each passage is already one continuous PCM buffer, no extra jitter
          # priming is required. A tiny scheduling lead prevents clock-edge clicks.
          s=s.replace(
              "new StreamingPlayer({sampleRate:S.ai.tts.sampleRate})",
              "new StreamingPlayer({sampleRate:S.ai.tts.sampleRate,primeSeconds:0,leadSeconds:0.08})"
          )

          p.write_text(s)
          PY
          npm install --no-audit --no-fund
          npm run build
          rm -rf ../app/src/main/assets/vox
          mkdir -p ../app/src/main/assets/vox
          cp -R dist/. ../app/src/main/assets/vox/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VoxBook-0.4.2.apk

      - name: Upload VoxBook APK
        uses: actions/upload-artifact@v4
        with:
          name: VoxBook-0.4.2-APK
          path: VoxBook-0.4.2.apk
          if-no-files-found: error
          retention-days: 30
