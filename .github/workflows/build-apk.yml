name: Build VoxBook APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-v080]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare VoxBook 0.5 base
        run: python tools/prepare_v050.py

      - name: Prepare VoxBook 0.6.1 narrator engine
        run: python tools/prepare_v060.py

      - name: Prepare VoxBook 0.7 background and UI
        run: python tools/prepare_v070.py

      - name: Prepare VoxBook 0.7.1 narration fixes
        run: python tools/prepare_v071.py

      - name: Prepare VoxBook 0.8 seamless narration
        run: python tools/prepare_v080.py

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Tune Pocket-TTS for speed and stability
        run: python tools/tune_pocket_tts.py

      - name: Build web bundle
        working-directory: web
        run: |
          npm run build
          rm -rf ../app/src/main/assets/vox
          mkdir -p ../app/src/main/assets/vox
          cp -R dist/. ../app/src/main/assets/vox/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VoxBook-0.8.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk VoxBook.apk

      - name: Upload VoxBook APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxBook-0.8.0-APK
          path: VoxBook-0.8.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish tester release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.8.0 >/dev/null 2>&1; then
            gh release upload v0.8.0 VoxBook.apk VoxBook-0.8.0.apk --clobber
          else
            gh release create v0.8.0 VoxBook.apk VoxBook-0.8.0.apk --title "VoxBook 0.8.0 – Seamless Narration" --notes "Tester build. Hardens Android foreground media playback, preserves PDF paragraphs and lists, splits overly long sentences at natural clause boundaries, and continuously prepares upcoming AI narration while current audio is playing."
          fi
