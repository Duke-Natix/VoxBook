name: Build VoxBook APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-v112]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare VoxBook 0.5 base
        run: python tools/prepare_v050.py

      - name: Prepare VoxBook 0.6.1 narrator engine
        run: python tools/prepare_v060.py

      - name: Prepare VoxBook 0.7 background and UI
        run: python tools/prepare_v070.py

      - name: Prepare VoxBook 0.7.1 narration fixes
        run: python tools/prepare_v071.py

      - name: Prepare VoxBook 0.8 seamless narration
        run: python tools/prepare_v080.py

      - name: Prepare VoxBook 0.9 native seamless audio
        run: python tools/prepare_v090.py

      - name: Prepare VoxBook 0.9.1 migration version
        run: python tools/prepare_v091.py

      - name: Prepare VoxBook 0.9.2 persistent signing baseline
        run: python tools/prepare_v092.py

      - name: Prepare VoxBook 1.0 PDF and streaming engine
        run: python tools/prepare_v100.py

      - name: Prepare VoxBook 1.1 media controls and collection
        run: python tools/prepare_v110.py

      - name: Prepare VoxBook 1.1.1 PDF regex hotfix
        run: python tools/prepare_v111.py

      - name: Prepare VoxBook 1.1.2 robust PDF cleanup and adaptive themes
        run: python tools/prepare_v112.py

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Keep Pocket-TTS at upstream voice-quality defaults
        run: python tools/tune_pocket_tts.py

      - name: Build web bundle
        working-directory: web
        run: |
          npm run build
          rm -rf ../app/src/main/assets/vox
          mkdir -p ../app/src/main/assets/vox
          cp -R dist/. ../app/src/main/assets/vox/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore stable VoxBook Android signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.voxbook-signing/voxbook.keystore
          key: voxbook-android-signing-v2

      - name: Create stable signing key on first build
        run: |
          mkdir -p "$HOME/.voxbook-signing"
          if [ ! -f "$HOME/.voxbook-signing/voxbook.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.voxbook-signing/voxbook.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=VoxBook Stable,O=VoxBook,C=AT"
          fi
          test -s "$HOME/.voxbook-signing/voxbook.keystore"
          echo "Signing key cache hit: ${{ steps.signing-cache.outputs.cache-hit }}"
          keytool -list -v -keystore "$HOME/.voxbook-signing/voxbook.keystore" -storepass android -alias androiddebugkey | grep -E "SHA256:|Valid from:" || true

      - name: Build signed installable APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VoxBook-1.1.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk VoxBook.apk

      - name: Upload VoxBook APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxBook-1.1.2-APK
          path: VoxBook-1.1.2.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish tester release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.2 >/dev/null 2>&1; then
            gh release upload v1.1.2 VoxBook.apk VoxBook-1.1.2.apk --clobber
          else
            gh release create v1.1.2 VoxBook.apk VoxBook-1.1.2.apk \
              --title "VoxBook 1.1.2 – PDF Fix & Adaptive Story Theme" \
              --notes "Removes the fragile Unicode-property PDF cleanup regex entirely and replaces it with safe character-based dehyphenation. Adds an optional dynamic colour scheme that follows the mood of the current story passage while preserving the manual theme as fallback. Keeps the 1.1 collection, media controls, background service and 20-second voice capture."
          fi
