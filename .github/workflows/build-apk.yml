name: Build VoxBook APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-v131]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare VoxBook 0.5 base
        run: python tools/prepare_v050.py
      - name: Prepare VoxBook 0.6.1 narrator engine
        run: python tools/prepare_v060.py
      - name: Prepare VoxBook 0.7 background and UI
        run: python tools/prepare_v070.py
      - name: Prepare VoxBook 0.7.1 narration fixes
        run: python tools/prepare_v071.py
      - name: Prepare VoxBook 0.8 seamless narration
        run: python tools/prepare_v080.py
      - name: Prepare VoxBook 0.9 native seamless audio
        run: python tools/prepare_v090.py
      - name: Prepare VoxBook 0.9.1 migration version
        run: python tools/prepare_v091.py
      - name: Prepare VoxBook 0.9.2 persistent signing baseline
        run: python tools/prepare_v092.py
      - name: Prepare VoxBook 1.0 PDF and streaming engine
        run: python tools/prepare_v100.py
      - name: Prepare VoxBook 1.1 media controls and collection
        run: python tools/prepare_v110.py
      - name: Prepare VoxBook 1.1.1 PDF regex hotfix
        run: python tools/prepare_v111.py
      - name: Prepare VoxBook 1.1.2 adaptive themes
        run: python tools/prepare_v112.py
      - name: Prepare VoxBook 1.1.3 hard PDF cleanup fix
        run: python tools/prepare_v113.py
      - name: Prepare VoxBook 1.1.4 persistent current document
        run: python tools/prepare_v114.py
      - name: Prepare VoxBook 1.1.5 resilient minimized playback
        run: python tools/prepare_v115.py
      - name: Prepare VoxBook 1.1.6 background recursion hotfix
        run: python tools/prepare_v116.py
      - name: Prepare VoxBook 1.2 worker-owned background narration
        run: python tools/prepare_v120.py
      - name: Prepare VoxBook 1.2.1 reliable audio bridge
        run: python tools/prepare_v121.py
      - name: Prepare VoxBook 1.3 native background narration
        run: python tools/prepare_v130.py
      - name: Prepare VoxBook 1.3.1 voice quality stabilization
        run: python tools/prepare_v131.py

      - name: Verify unsafe PDF regex is gone
        run: |
          python - <<'PY'
          from pathlib import Path
          bad=[]
          for p in Path('app/src/main').rglob('*'):
              if p.suffix not in {'.java','.kt'}: continue
              s=p.read_text(errors='ignore')
              for needle in ('\\\\p{L}','\\\\p{Ll}','(?U)','(? U)'):
                  if needle in s: bad.append((str(p),needle))
          if bad:
              raise SystemExit('Unsafe PDF regex still present: '+repr(bad))
          print('PDF regex verification OK')
          PY

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Keep legacy web Pocket-TTS available for migration
        run: python tools/tune_pocket_tts.py

      - name: Build web bundle
        working-directory: web
        run: |
          npm run build
          rm -rf ../app/src/main/assets/vox
          mkdir -p ../app/src/main/assets/vox
          cp -R dist/. ../app/src/main/assets/vox/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and CMake
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Prepare native Pocket-TTS runtime
        run: |
          rm -rf /tmp/voxbook-pocket-native /tmp/voxbook-thorsten
          git clone --depth 1 --branch v0.5.2 https://github.com/The-unknown-Shadowman/PocketTTS-Android-Engine.git /tmp/voxbook-pocket-native
          mkdir -p vendor/PocketTTS.cpp app/src/main/cpp app/src/main/assets/licenses app/src/main/assets/voices app/src/main/jniLibs/arm64-v8a app/src/main/third_party /tmp/voxbook-thorsten
          cp /tmp/voxbook-pocket-native/vendor/PocketTTS.cpp/pocket_tts.cpp vendor/PocketTTS.cpp/pocket_tts.cpp
          cp /tmp/voxbook-pocket-native/app/src/main/cpp/CMakeLists.txt app/src/main/cpp/CMakeLists.txt
          cp /tmp/voxbook-pocket-native/app/src/main/cpp/jni_bridge.cpp app/src/main/cpp/jni_bridge.cpp
          sed -i 's/Java_org_pockettts_android_engine_NativePocketTts_/Java_com_varoxan_voxbook_NativePocketTts_/g' app/src/main/cpp/jni_bridge.cpp
          bash /tmp/voxbook-pocket-native/scripts/prepare_android_native_deps.sh
          cp /tmp/voxbook-pocket-native/app/src/main/jniLibs/arm64-v8a/libonnxruntime.so app/src/main/jniLibs/arm64-v8a/libonnxruntime.so
          rm -rf app/src/main/third_party/onnxruntime
          cp -R /tmp/voxbook-pocket-native/app/src/main/third_party/onnxruntime app/src/main/third_party/onnxruntime
          cp /tmp/voxbook-pocket-native/LICENSE app/src/main/assets/licenses/PocketTTS-Android-Engine-LICENSE.txt
          cp /tmp/voxbook-pocket-native/THIRD_PARTY_NOTICES.md app/src/main/assets/licenses/PocketTTS-Android-Engine-THIRD-PARTY.md
          cp /tmp/voxbook-pocket-native/MODEL_LICENSE.md app/src/main/assets/licenses/PocketTTS-MODEL-LICENSE.md

          # Clean CC0 German narrator reference. PocketTTS Android's own docs
          # note that a clean Thorsten-Voice excerpt produced fewer artifacts
          # than its bundled Jürgen reference in a local German comparison.
          THORSTEN_REF="29d0c153c55d8ffaa0ebf8ed1ecc879bff9fdf27"
          for n in 01 02 03 04; do
            curl -fL "https://raw.githubusercontent.com/thorstenMueller/Thorsten-Voice/${THORSTEN_REF}/docs/samples/sample${n}-gt.wav" -o "/tmp/voxbook-thorsten/sample${n}.wav"
          done
          printf "file '/tmp/voxbook-thorsten/sample01.wav'\nfile '/tmp/voxbook-thorsten/sample02.wav'\nfile '/tmp/voxbook-thorsten/sample03.wav'\nfile '/tmp/voxbook-thorsten/sample04.wav'\n" > /tmp/voxbook-thorsten/list.txt
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i /tmp/voxbook-thorsten/list.txt -ar 24000 -ac 1 -c:a pcm_s16le app/src/main/assets/voices/thorsten-cc0.wav
          curl -fL "https://raw.githubusercontent.com/thorstenMueller/Thorsten-Voice/${THORSTEN_REF}/LICENSE" -o app/src/main/assets/licenses/Thorsten-Voice-CC0.txt

          test -s vendor/PocketTTS.cpp/pocket_tts.cpp
          test -s app/src/main/jniLibs/arm64-v8a/libonnxruntime.so
          test -s app/src/main/assets/voices/thorsten-cc0.wav
          test -s app/src/main/assets/licenses/Thorsten-Voice-CC0.txt

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore stable VoxBook Android signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.voxbook-signing/voxbook.keystore
          key: voxbook-android-signing-v2

      - name: Create stable signing key on first build
        run: |
          mkdir -p "$HOME/.voxbook-signing"
          if [ ! -f "$HOME/.voxbook-signing/voxbook.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.voxbook-signing/voxbook.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=VoxBook Stable,O=VoxBook,C=AT"
          fi
          test -s "$HOME/.voxbook-signing/voxbook.keystore"

      - name: Build signed installable APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VoxBook-1.3.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk VoxBook.apk

      - name: Upload VoxBook APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxBook-1.3.1-APK
          path: VoxBook-1.3.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish tester release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.3.1 >/dev/null 2>&1; then
            gh release upload v1.3.1 VoxBook.apk VoxBook-1.3.1.apk --clobber
          else
            gh release create v1.3.1 VoxBook.apk VoxBook-1.3.1.apk \
              --title "VoxBook 1.3.1 – Clear Voice Stabilization" \
              --notes "Voice-quality hotfix for the native background narrator. German narration now uses a clean CC0 Thorsten-Voice reference instead of the rougher bundled reference, reduces sampling randomness, limits generation chunks to reduce metallic/garbled passages, increases the initial audio buffer, and changes own-voice recording to the Pocket-TTS recommended 12–15 second range. Native background playback, PDF reader, collection, themes, updates and media controls remain unchanged."
          fi
