name: Build VoxBook APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || hashFiles('.v02-ready') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Build VoxBook interface and AI runtime
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build
          rm -rf ../app/src/main/assets/vox
          mkdir -p ../app/src/main/assets/vox
          cp -R dist/. ../app/src/main/assets/vox/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VoxBook.apk

      - name: Upload VoxBook APK
        uses: actions/upload-artifact@v4
        with:
          name: VoxBook-APK
          path: VoxBook.apk
          if-no-files-found: error
          retention-days: 30
